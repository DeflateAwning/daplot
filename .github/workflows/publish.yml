name: Publish release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Manual (workflow_dispatch) runs are practice runs: they build everything
  # but skip publishing to crates.io and skip uploading to a GitHub Release.
  IS_PRACTICE_RUN: ${{ github.event_name != 'push' && 'true' || 'false' }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

      - name: Publish (dry run)
        if: env.IS_PRACTICE_RUN == 'true'
        run: cargo publish --dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish
        if: env.IS_PRACTICE_RUN == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-windows:
    name: Build Windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/daplot.exe "dist/daplot-${GITHUB_REF_NAME}-windows-x86_64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: daplot-windows-x86_64
          path: dist/*.exe

      - name: Upload to GitHub Release
        if: env.IS_PRACTICE_RUN == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  build-macos:
    name: Build macOS binary
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Rename binary
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/daplot" "dist/daplot-${GITHUB_REF_NAME}-${{ matrix.target }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: daplot-${{ matrix.target }}
          path: dist/*

      - name: Upload to GitHub Release
        if: env.IS_PRACTICE_RUN == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
